name: Vérification du respect des spécifications

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Installation des dépendances
      run: pip install -r requirements.txt
    - name: Vérification du schéma, du dialecte et du fichier d'exemple valide
      run: |
        frictionless validate --type schema schema.json
        frictionless validate --type dialect dialect.json
        frictionless validate --schema schema.json --dialect dialect.json exemple-valide.csv
    - name: Vérification de la cohérence des numéros de version
      run: python .github/workflows/assert_version.py
    - name: Vérification que le fichier d'exemple CSV invalide est bien rejeté
      run: |
        if frictionless validate --schema schema.json --dialect dialect.json exemple-invalide.csv; then
          echo "exemple-invalide.csv devrait être invalide"; exit 1
        fi
