name: Vérification du respect des spécifications

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Installation des dépendances
      run: pip install -r requirements.txt
    - name: Vérification du schéma et du fichier d'exemple valide
      run: |
        frictionless validate --type schema schema.json
        frictionless validate --schema schema.json exemple-valide.csv
    - name: Contrôles complémentaires sur le fichier d'exemple valide
      run: python controles_complementaires.py exemple-valide.csv
    - name: Vérification de la cohérence des numéros de version
      run: python .github/workflows/assert_version.py
    - name: Vérification que le fichier d'exemple invalide produit exactement les erreurs attendues
      run: python .github/workflows/check_expected_errors.py
